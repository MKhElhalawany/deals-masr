name: build

# Zero-maintenance pipeline:
#  • push / manual run       → test, provision Supabase, build + publish the APK
#  • every 15 minutes        → does nothing unless the SUPABASE_ACCESS_TOKEN secret exists AND the newest commit
#                              has no connected APK yet (this is how setup starts by itself after the secret is added)
#  • results                 → GitHub issues (GitHub e-mails the repo owner): "📱 آخر نسخة" with the APK link,
#                              or "⚠️ التحديث التلقائي واقف" with the reason in plain words.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.p.outputs.go }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_SERVER: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_SSH_KEY != '' }}
          HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' || secrets.FIREBASE_ANDROID_CONFIG != '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          go=false
          if [ "$HAS_TOKEN" = "true" ]; then
            latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
            deployed=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/worker-deployed" -q .object.sha 2>/dev/null || true)
            need=false
            echo "$latest" | grep -q "connected:$GITHUB_SHA" || need=true
            [ "$HAS_SERVER" = "true" ] && [ "$deployed" != "$GITHUB_SHA" ] && need=true
            # Firebase secret added later → rebuild once so the APK gets push
            [ "$HAS_FIREBASE" = "true" ] && ! echo "$latest" | grep -Eq "push:(on|failed)" && need=true
            if [ "$need" = "true" ]; then
              # don't hammer a failing setup: retry at most once an hour
              recent=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pipeline-failure --state open --json updatedAt \
                -q '[.[] | select((now - (.updatedAt | fromdateiso8601)) < 3300)] | length' 2>/dev/null || echo 0)
              [ "${recent:-0}" = "0" ] && go=true
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "scheduled check → go=$go"

  # The Android app must never scrape: fail the build if scraping code appears in it.
  no-device-scraping:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check_no_device_scraping.sh

  worker-tests:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: server/worker
        run: |
          pip install -q httpx beautifulsoup4 pytest
          python -m pytest -q tests
      - name: Worker image builds
        run: docker build -q -t deals-worker server/worker
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Edge scanner tests (Deno)
        working-directory: supabase/functions/scan
        run: deno test -A parsers_test.ts && deno check index.ts

  backend:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  supabase-sql:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + RLS/security tests on a throwaway Postgres
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f supabase/tests/supabase_stub.sql
          for f in supabase/migrations/*.sql; do sudo -u postgres psql -v ON_ERROR_STOP=1 -f "$f"; done
          # inside ONE transaction, exactly like the live run (catches same-timestamp collisions)
          (echo "begin;"; cat supabase/tests/rls_test.sql; echo "rollback;") | sudo -u postgres psql -v ON_ERROR_STOP=1

  # Creates/updates the Supabase project, applies migrations, live security gates, owner setup.
  # Needs only the SUPABASE_ACCESS_TOKEN secret. Outputs public values only (URL + publishable key).
  supabase:
    needs: supabase-sql
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.setup.outputs.url }}
      key: ${{ steps.setup.outputs.key }}
      owner: ${{ steps.setup.outputs.owner }}
      admin_ready: ${{ steps.setup.outputs.admin_ready }}
      error: ${{ steps.setup.outputs.error }}
    steps:
      - uses: actions/checkout@v4
      - id: setup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: python3 tools/supabase_setup.py

  # Free 24/7 scanner on Supabase Edge Functions + pg_cron (no VM / no card). Steps aside when a VM worker runs.
  edge:
    needs: [supabase, worker-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.supabase.outputs.url != ''
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.e.outputs.report }}
      working: ${{ steps.e.outputs.working }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy the scan function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          URL: ${{ needs.supabase.outputs.url }}
        run: |
          REF=$(echo "$URL" | sed -E 's#https://([^.]+)\..*#\1#')
          supabase functions deploy scan --project-ref "$REF" --no-verify-jwt --use-api
      - id: e
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install -q httpx
          python3 tools/edge_setup.py

  # Push notifications: registers the Android app in the owner's Firebase project and outputs its PUBLIC client ids.
  firebase:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.f.outputs.enabled }}
      error: ${{ steps.f.outputs.error }}
      api_key: ${{ steps.f.outputs.api_key }}
      app_id: ${{ steps.f.outputs.app_id }}
      project_id: ${{ steps.f.outputs.project_id }}
      sender_id: ${{ steps.f.outputs.sender_id }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          pip install -q httpx google-auth requests
          python3 tools/firebase_setup.py

  # Deploys the 24/7 scraping worker to the server (Oracle Cloud Always Free VM) when SERVER_HOST + SERVER_SSH_KEY exist.
  deploy-worker:
    needs: [supabase, worker-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.d.outputs.result }}
      detail: ${{ steps.d.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "result=no-server" >> "$GITHUB_OUTPUT"; echo "::notice::No server yet (SERVER_HOST / SERVER_SSH_KEY secrets)."; exit 0
          fi
          USER_AT="${SERVER_USER:-ubuntu}@$SERVER_HOST"
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_server
          WORKER_ENV_FILE=$RUNNER_TEMP/worker.env python3 tools/supabase_setup.py
          [ -n "$PROXY_URL" ] && echo "PROXY_URL=$PROXY_URL" >> "$RUNNER_TEMP/worker.env"
          # docker --env-file needs one line: pass the service account base64-encoded (never printed)
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && echo "FIREBASE_SERVICE_ACCOUNT=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -w0)" >> "$RUNNER_TEMP/worker.env"
          SSH="ssh -i $HOME/.ssh/id_server -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          set +e
          scp -q -i ~/.ssh/id_server -o StrictHostKeyChecking=accept-new "$RUNNER_TEMP/worker.env" "$USER_AT:deals-worker.env" \
            && $SSH "$USER_AT" 'chmod 600 ~/deals-worker.env && bash -s' < server/deploy.sh > "$RUNNER_TEMP/deploy.log" 2>&1
          rc=$?
          set -e
          rm -f "$RUNNER_TEMP/worker.env" ~/.ssh/id_server
          cat "$RUNNER_TEMP/deploy.log"
          if [ $rc -ne 0 ]; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "detail=$(tail -3 "$RUNNER_TEMP/deploy.log" | tr '\n' ' ' | cut -c1-300)" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=deployed" >> "$GITHUB_OUTPUT"
          # marker so the 15-minute check knows this commit is running on the server
          GH_TOKEN=${{ github.token }} gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/worker-deployed" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 \
            || GH_TOKEN=${{ github.token }} gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/worker-deployed -f sha="$GITHUB_SHA" >/dev/null

  android:
    needs: [backend, supabase, no-device-scraping, firebase]
    if: always() && needs.backend.result == 'success' && needs.no-device-scraping.result == 'success' && (needs.supabase.result == 'success' || needs.supabase.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.publish.outputs.apk }}
      connected: ${{ steps.publish.outputs.connected }}
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        env:
          SUPABASE_URL: ${{ needs.supabase.outputs.url || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ needs.supabase.outputs.key || vars.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ needs.firebase.outputs.api_key }}
          FIREBASE_APP_ID: ${{ needs.firebase.outputs.app_id }}
          FIREBASE_PROJECT_ID: ${{ needs.firebase.outputs.project_id }}
          FIREBASE_SENDER_ID: ${{ needs.firebase.outputs.sender_id }}
        run: ./gradlew --no-daemon assembleDebug -PapiBaseUrl="${{ vars.API_BASE_URL }}"
      - name: Publish APK (main only)
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTED: ${{ needs.supabase.outputs.url || vars.SUPABASE_URL }}
          PUSH: ${{ needs.firebase.outputs.enabled == 'true' && 'push:on' || (needs.firebase.outputs.error != '' && 'push:failed' || 'push:off') }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DealsMasr.apk
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ -n "$CONNECTED" ]; then
            gh release create "$TAG" DealsMasr.apk --title "عروض مصر — نسخة ${{ github.run_number }}" \
              --notes "connected:${{ github.sha }} $PUSH" --latest
            echo "connected=yes" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" DealsMasr.apk --title "Build ${{ github.run_number }} (no backend)" \
              --notes "Built without Supabase (SUPABASE_ACCESS_TOKEN secret not added yet)." --prerelease --latest=false
            echo "connected=no" >> "$GITHUB_OUTPUT"
          fi
          echo "apk=https://github.com/${{ github.repository }}/releases/download/$TAG/DealsMasr.apk" >> "$GITHUB_OUTPUT"

  # Real measurements (not promises): server write → Realtime WebSocket delivery, FCM accept time, worker status.
  latency:
    needs: [supabase, deploy-worker, edge]
    if: always() && needs.supabase.result == 'success' && needs.supabase.outputs.url != ''
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.m.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ needs.supabase.outputs.url }}
          SUPABASE_PUBLISHABLE_KEY: ${{ needs.supabase.outputs.key }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install -q httpx websockets google-auth requests
          umask 077
          WORKER_ENV_FILE=$RUNNER_TEMP/m.env python3 tools/supabase_setup.py
          set +e
          LATENCY_OUT=$RUNNER_TEMP/latency.md WORKER_ENV_FILE=$RUNNER_TEMP/m.env python3 tools/measure_latency.py
          rc=$?
          rm -f $RUNNER_TEMP/m.env
          { echo "report<<LATENCY_EOF"; cat $RUNNER_TEMP/latency.md; echo; echo "LATENCY_EOF"; } >> "$GITHUB_OUTPUT"
          exit $rc

  report:
    needs: [plan, backend, supabase-sql, supabase, android, no-device-scraping, worker-tests, deploy-worker, firebase, latency, edge]
    if: always() && needs.plan.outputs.go == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_BACKEND: ${{ needs.backend.result }}
          R_SQL: ${{ needs.supabase-sql.result }}
          R_SUPABASE: ${{ needs.supabase.result }}
          R_ANDROID: ${{ needs.android.result }}
          R_GUARD: ${{ needs.no-device-scraping.result }}
          R_WORKER_TESTS: ${{ needs.worker-tests.result }}
          R_DEPLOY: ${{ needs.deploy-worker.result }}
          DEPLOY_RESULT: ${{ needs.deploy-worker.outputs.result }}
          DEPLOY_DETAIL: ${{ needs.deploy-worker.outputs.detail }}
          SUPABASE_ERROR: ${{ needs.supabase.outputs.error }}
          APK: ${{ needs.android.outputs.apk }}
          CONNECTED: ${{ needs.android.outputs.connected }}
          OWNER: ${{ needs.supabase.outputs.owner }}
          ADMIN_READY: ${{ needs.supabase.outputs.admin_ready }}
          FIREBASE: ${{ needs.firebase.outputs.enabled }}
          FIREBASE_ERROR: ${{ needs.firebase.outputs.error }}
          LATENCY: ${{ needs.latency.outputs.report }}
          EDGE: ${{ needs.edge.outputs.report }}
          EDGE_WORKING: ${{ needs.edge.outputs.working }}
          R_EDGE: ${{ needs.edge.result }}
        run: python3 tools/pipeline_report.py
