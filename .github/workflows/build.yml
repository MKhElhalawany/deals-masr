name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PapiBaseUrl="${{ vars.API_BASE_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: deals-masr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK as GitHub release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DealsMasr.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" DealsMasr.apk --title "Deals Masr debug build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}" --latest
